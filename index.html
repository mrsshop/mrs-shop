<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRS SHOP</title>
<style>
  :root { --ink:#1d2320; --muted:#667069; --line:#e3e6df; --bg:#f6f7f2; --card:#fff; --accent:#1f5e4b; --danger:#b3261e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--ink); }
  button, input, textarea { font-family: inherit; }
  header { background: var(--accent); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 22px; cursor: pointer; font-weight: normal; }
  .hbtn { background: #fff; color: var(--accent); border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
  .card img, .noimg { width: 100%; height: 280px; object-fit: cover; background: #e6e9e1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .imgwrap { position: relative; cursor: zoom-in; }
  .badge { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; padding: 4px 9px; border-radius: 12px; }
  .info { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .info p { font-size: 14px; color: var(--muted); flex: 1; line-height: 1.4; }
  .price { font-weight: bold; font-size: 18px; }
  .sold { font-size: 14px; font-weight: bold; color: #c2410c; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-size: 15px; }
  .btn:hover { opacity: .9; }
  .hidden { display: none !important; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
  h2 { font-weight: normal; font-size: 20px; margin-bottom: 12px; }
  .cart-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .cart-item img, .cart-item .noimg { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; font-size: 10px; }
  .cart-item .name { flex: 1; min-width: 120px; }
  .qty button { width: 28px; height: 28px; cursor: pointer; }
  .remove { background: none; border: none; color: var(--danger); cursor: pointer; }
  .total { text-align: right; font-size: 18px; font-weight: bold; margin-top: 12px; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; }
  input[type=text], input[type=tel], textarea { width: 100%; padding: 10px; border: 1px solid #c9cec4; border-radius: 4px; font-size: 15px; }
  .wide { width: 100%; margin-top: 16px; padding: 12px; font-size: 16px; }
  .back { display: inline-block; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 14px 26px; margin-bottom: 20px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform .15s, box-shadow .15s; }
  .back:hover { transform: translateY(-2px); box-shadow: 0 5px 12px rgba(0,0,0,.25); }
  .success { text-align: center; padding: 40px 10px; }

  /* ---- PHOTO VIEWER ---- */
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .vbox { background: #fff; border-radius: 8px; width: 100%; max-width: 640px; max-height: 96vh; overflow-y: auto; padding: 14px; position: relative; }
  .vclose { position: absolute; top: 8px; right: 8px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(0,0,0,.65); color: #fff; font-size: 18px; cursor: pointer; }
  .vmain { position: relative; display: flex; align-items: center; justify-content: center; background: #f0f0f0; border-radius: 6px; min-height: 200px; }
  .vmain img { max-width: 100%; max-height: 60vh; object-fit: contain; display: block; }
  .varrow { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
  .varrow.l { left: 8px; }
  .varrow.r { right: 8px; }
  .vthumbs { display: flex; gap: 8px; margin: 10px 0; overflow-x: auto; }
  .vthumbs img { width: 62px; height: 62px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; opacity: .7; }
  .vthumbs img.on { border-color: var(--accent); opacity: 1; }
  .vinfo h3 { font-size: 18px; margin-bottom: 4px; }
  .vinfo p { font-size: 14px; color: var(--muted); line-height: 1.4; margin-bottom: 8px; }
</style>
</head>
<body>

<header>
  <h1 onclick="showPage('shop')">MRS SHOP</h1>
  <button class="hbtn" onclick="showPage('order')">Cart (<span id="cartCount">0</span>)</button>
</header>

<main>
  <!-- SHOP -->
  <section id="shopPage">
    <div class="grid" id="productGrid"></div>
  </section>

  <!-- ORDER -->
  <section id="orderPage" class="hidden">
    <button class="back" onclick="showPage('shop')">← Shopping e fire jan</button>
    <div id="orderContent">
      <div class="box">
        <h2>Apnar Cart</h2>
        <div id="cartItems"></div>
        <div class="total" id="cartTotal"></div>
      </div>
      <div class="box" id="formBox">
        <h2>Order Confirm Korun</h2>
        <form id="orderForm">
          <label>Apnar Nam</label>
          <input type="text" id="custName" required>
          <label>Phone Number</label>
          <input type="tel" id="custPhone" required inputmode="numeric" placeholder="01XXXXXXXXX" maxlength="20">
          <label>Thikana (Address)</label>
          <textarea id="custAddress" rows="3" required></textarea>
          <button type="submit" class="btn wide">Order Confirm Korun</button>
        </form>
      </div>
    </div>
    <div id="successBox" class="box success hidden">
      <h2>✅ Apnar order submit hoyeche!</h2>
      <p style="margin:12px 0">Amra shiggroi apnar sathe jogajog korbo. Dhonnobad!</p>
      <button class="btn" onclick="showPage('shop')">Abar Shopping Korun</button>
    </div>
  </section>
</main>

<!-- PHOTO VIEWER -->
<div id="viewer" class="viewer hidden" onclick="closeViewer()">
  <div class="vbox" onclick="event.stopPropagation()">
    <button class="vclose" onclick="closeViewer()">✕</button>
    <div class="vmain" id="vMain">
      <button class="varrow l" id="vPrev" onclick="vMove(-1)">‹</button>
      <img id="vImg" src="" alt="">
      <button class="varrow r" id="vNext" onclick="vMove(1)">›</button>
    </div>
    <div class="vthumbs" id="vThumbs"></div>
    <div class="vinfo" id="vInfo"></div>
    <button class="btn wide" id="vAdd" style="margin-top:6px">Add to Cart</button>
  </div>
</div>

<script>
/* ================= SETTINGS ================= */
const CURRENCY = "৳";
const WHATSAPP_NUMBER = "8801727656589"; // nijer WhatsApp number (country code shoho, + chara)

/* ================= PRODUCT LIST =================
   Product edit korte: nam, price, description, photo bodlan.
   Ekta photo hole:      image: "tshirt.png",
   Ekadhik photo hole:   images: ["tshirt.png", "tshirt2.png", "tshirt3.png"],
   (images dile image line lagbe na. Prothom photo ta card e dekhabe.)
   sold: koto ta bikri hoyeche (0 hole dekhabe na).
   Notun product add korte pura { ... }, block copy kore id bodlan.
================================================== */
const products = [
  {
    id: 1,
    name: "Man T-Shirt",
    price: 600,
    images: ["images.jpg"],   // aro photo dite: ["images.jpg", "images2.jpg", "images3.jpg"]
    description: "Soft cotton er comfortable man t-shirt.",
    sold: 0
  },
  {
    id: 2,
    name: "By Owner",
    price: 0,
    image: "shirt.jpeg",
    description: "product not available.",
    sold: 0
  },
  {
    id: 3,
    name: "Women T-Shirt",
    price: 800,
    image: "tshirt.jfif",
    description: "Soft cotton er women t-shirt.",
    sold: 0
  },
  {
    id: 4,
    name: "nam nai",
    price: 0,
    image: ["tshirt1.png", "shirt2.jpeg"],
    description: "not available.",
    sold: 0
  },
];
/* ============================================== */

let cart = [];
try { cart = JSON.parse(localStorage.getItem("cart")) || []; } catch (e) { cart = []; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function getImgs(p) {
  return (p.images && p.images.length) ? p.images : [p.image];
}
function imgTag(p) {
  return `<img src="${esc(getImgs(p)[0])}" alt="${esc(p.name)}" onerror="this.outerHTML='<div class=noimg>Photo nei</div>'">`;
}
function soldLine(p) {
  return p.sold > 0 ? `<div class="sold">🔥 ${esc(p.sold)} jon kinechen</div>` : "";
}

/* ---------- SHOP ---------- */
function renderProducts() {
  document.getElementById("productGrid").innerHTML = products.map(p => {
    const n = getImgs(p).length;
    return `
    <div class="card">
      <div class="imgwrap" onclick="openViewer(${p.id})">
        ${imgTag(p)}
        ${n > 1 ? `<span class="badge">📷 ${n} photo</span>` : ""}
      </div>
      <div class="info">
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.description || "")}</p>
        <div class="price">${CURRENCY}${esc(p.price)}</div>
        ${soldLine(p)}
        <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    </div>`;
  }).join("");
}

/* ---------- PHOTO VIEWER ---------- */
let vProduct = null, vIndex = 0;

function openViewer(id) {
  vProduct = products.find(x => x.id === id);
  if (!vProduct) return;
  vIndex = 0;
  document.getElementById("vAdd").onclick = function () { closeViewer(); addToCart(id); };
  renderViewer();
  document.getElementById("viewer").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeViewer() {
  document.getElementById("viewer").classList.add("hidden");
  document.body.style.overflow = "";
}
function vMove(d) {
  const n = getImgs(vProduct).length;
  vIndex = (vIndex + d + n) % n;
  renderViewer();
}
function vSet(i) { vIndex = i; renderViewer(); }
function renderViewer() {
  const imgs = getImgs(vProduct);
  const img = document.getElementById("vImg");
  img.src = imgs[vIndex];
  img.alt = vProduct.name;
  const many = imgs.length > 1;
  document.getElementById("vPrev").classList.toggle("hidden", !many);
  document.getElementById("vNext").classList.toggle("hidden", !many);
  document.getElementById("vThumbs").innerHTML = many
    ? imgs.map((src, i) => `<img src="${esc(src)}" class="${i === vIndex ? "on" : ""}" onclick="vSet(${i})" alt="">`).join("")
    : "";
  document.getElementById("vInfo").innerHTML = `
    <h3>${esc(vProduct.name)}</h3>
    <p>${esc(vProduct.description || "")}</p>
    <div class="price">${CURRENCY}${esc(vProduct.price)}</div>`;
}

document.addEventListener("keydown", function (e) {
  if (document.getElementById("viewer").classList.contains("hidden")) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowLeft" && getImgs(vProduct).length > 1) vMove(-1);
  if (e.key === "ArrowRight" && getImgs(vProduct).length > 1) vMove(1);
});

/* phone e swipe */
let touchX = null;
const vMain = document.getElementById("vMain");
vMain.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
vMain.addEventListener("touchend", e => {
  if (touchX === null || getImgs(vProduct).length < 2) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) vMove(dx < 0 ? 1 : -1);
  touchX = null;
});

/* ---------- CART ---------- */
function saveCart() {
  try { localStorage.setItem("cart", JSON.stringify(cart)); } catch (e) {}
  document.getElementById("cartCount").textContent = cart.reduce((s, i) => s + i.qty, 0);
}
function addToCart(id) {
  const item = cart.find(i => i.id === id);
  if (item) item.qty++; else cart.push({ id, qty: 1 });
  saveCart();
  showPage("order");
}
function changeQty(id, d) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.qty += d;
  if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
  saveCart(); renderCart();
}
function removeItem(id) { cart = cart.filter(i => i.id !== id); saveCart(); renderCart(); }
function cartTotal() {
  return cart.reduce((s, i) => { const p = products.find(x => x.id === i.id); return s + (p ? p.price * i.qty : 0); }, 0);
}
function renderCart() {
  cart = cart.filter(i => products.some(p => p.id === i.id)); // list theke muche dewa product bad
  saveCart();
  const box = document.getElementById("cartItems");
  if (cart.length === 0) {
    box.innerHTML = "<p>Apnar cart khali.</p>";
    document.getElementById("cartTotal").textContent = "";
    document.getElementById("formBox").classList.add("hidden");
    return;
  }
  document.getElementById("formBox").classList.remove("hidden");
  box.innerHTML = cart.map(i => {
    const p = products.find(x => x.id === i.id);
    return `
      <div class="cart-item">
        ${imgTag(p)}
        <div class="name">${esc(p.name)}<br><small>${CURRENCY}${esc(p.price)}</small></div>
        <div class="qty">
          <button onclick="changeQty(${p.id}, -1)">-</button>
          <span> ${i.qty} </span>
          <button onclick="changeQty(${p.id}, 1)">+</button>
        </div>
        <button class="remove" onclick="removeItem(${p.id})">Remove</button>
      </div>`;
  }).join("");
  document.getElementById("cartTotal").textContent = "Total: " + CURRENCY + cartTotal();
}

function showPage(page) {
  document.getElementById("shopPage").classList.toggle("hidden", page !== "shop");
  document.getElementById("orderPage").classList.toggle("hidden", page !== "order");
  if (page === "shop") renderProducts();
  if (page === "order") {
    document.getElementById("orderContent").classList.remove("hidden");
    document.getElementById("successBox").classList.add("hidden");
    renderCart();
  }
  window.scrollTo(0, 0);
}

/* ---------- ORDER ---------- */
document.getElementById("orderForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const name = document.getElementById("custName").value.trim();
  let phone = document.getElementById("custPhone").value.trim();
  phone = phone.replace(/[০-৯]/g, d => "০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/[\s\-()]/g, "");
  if (!/^(\+?88)?01[3-9][0-9]{8}$/.test(phone)) {
    alert("Sothik 11 digit er phone number din (jemon 01712345678).");
    return;
  }
  const address = document.getElementById("custAddress").value.trim();
  let msg = "Notun Order!\n\nNam: " + name + "\nPhone: " + phone + "\nThikana: " + address + "\n\nProduct:\n";
  cart.forEach(i => {
    const p = products.find(x => x.id === i.id);
    if (p) msg += "- " + p.name + " x" + i.qty + " = " + CURRENCY + (p.price * i.qty) + "\n";
  });
  msg += "\nTotal: " + CURRENCY + cartTotal();
  window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg), "_blank");
  cart = []; saveCart();
  this.reset();
  document.getElementById("orderContent").classList.add("hidden");
  document.getElementById("successBox").classList.remove("hidden");
});

document.getElementById("custPhone").addEventListener("input", function () {
  this.value = this.value.replace(/[০-৯]/g, d => "০১২৩৪৫৬৭৮৯".indexOf(d));
});

renderProducts();
saveCart();
</script>
</body>
</html>
